<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Les Petits Plats est un site de recettes de cuisine, offrant une variété de plats pour tous les goûts."
    />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Anton&display=swap"
      rel="stylesheet"
    />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />

    <title>Les Petits Plats</title>
  </head>
  <body class= max-w-screen mx-auto">
  <header class="relative w-screen">
    <div class="absolute logo flex items-center w-2xs gap-1 py-16 px-8 z-200">
      <img
        src="/images/logo-Les petits plats.png"
        alt="Logo Les Petits Plats"
        class="h-6"
      />
      <img
        src="/images/Logo-round.png"
        alt="Logo rond Les Petits Plats"
        class="h-6"
      />
    </div>

    <div class="relative inset-x-0 top-0 h-40px overflow-hidden">
      <img
        src="images/background-photo.png"
        alt="Photo d'accueil Les Petits Plats"
        class="object-contain w-full h-50px"
      />

      <div
        class="absolute inset-0 flex flex-col justify-center items-center text-center px-20 w-400px z-200"
      >
        <h1 class="text-yellow-300 text-3xl md:text-5xl mb-6">
          Cherchez parmi plus de 1500 recettes<br />
          du quotidien, simples et délicieuses
        </h1>

        <div class="flex items-center w-full max-w-4xl mt-4 rounded-xl
        bg-neutral-50">
        <input
          id="search-input"
          type="text"
          placeholder="Rechercher une recette, un ingrédient..."
          aria-label="Rechercher une recette, un ingrédient"
          class="w-full h-16 rounded-xl ps-8 pr-16 text-base"
        />
        <button
          type="submit"
          aria-label="Rechercher une recette ou un ingrédient"
          class="flex justify-center items-center bg-black text-white w-12 h-12 rounded-xl p-2 mr-2"
        >
          <img
            src="images/magnifying-glass-search-icon.svg"
            alt="Chercher une recette ou un ingrédient"
            class="object-contain w-full h-6"
          />
        </button>
      </div>
    </div>
  </header>

  <section class="m-0 p-0">
    <div class="flex justify-between items-center px-10 py-4">
      <div
        class="flex flex-row flex-wrap justify-evenly justify-start gap-10 w-7xl"
        aria-label="Filtres de recherche"
      >
        <div
          class="flex w-40 bg-white rounded-lg"
          aria-label="Rechercher un ingrédient"
        >
          <select
            id="ingredients"
            class="border border-gray-300 rounded-lg px-2 py-1 w-60 bg-white"
            title="Sélectionner un ingrédient"
          >
            <option value="" disabled selected>Ingrédient</option>
            <option value="jus-citron" aria-label="Jus de citron">
              Jus de citron
            </option>
            <option value="glaçons" aria-label="Glaçons">Glaçons</option>
            <option value="tomate" aria-label="Tomate">Tomate</option>
            <option value="poulet" aria-label="Poulet">Poulet</option>
            <option value="poivron-rouge" aria-label="Poivron rouge">
              Poivron rouge
            </option>
            <option value="thon-miettes" aria-label="Thon en miettes">
              Thon en miettes
            </option>
            <option value="vinaigrette" aria-label="Vinaigrette">
              Vinaigrette
            </option>
            <option value="gruyere-rape" aria-label="Gruyère râpé">
              Gruyère râpé
            </option>
            <option value="oeuf" aria-label="Oeuf">Oeuf</option>
            <option value="creme-liquide" aria-label="Crème liquide">
              Crème liquide
            </option>
            <option value="creme-coco" aria-label="Crème de coco">
              Crème de Coco
            </option>
            <option value="thon-rouge" aria-label="Thon rouge">
              Thon rouge
            </option>
            <option value="carotte" aria-label="Carotte">Carotte</option>
            <option value="coulis-tomate" aria-label="Coulis de tomate">
              Coulis de tomate
            </option>
            <option value="huile-olive" aria-label="Huile d'olive">
              Huile d'olive
            </option>
            <option value="oeuf-dur" aria-label="Oeuf dur">Oeuf dur</option>
            <option value="pate-feuilletee" aria-label="Pâte feuilletée">
              Pâte feuilletée
            </option>
            <option value="moutarde-dijon" aria-label="Moutarde de Dijon">
              Moutarde de Dijon
            </option>
            <option value="sucre-poudre" aria-label="Sucre en poudr">
              Sucre en poudre
            </option>
            <option value="beurre" aria-label="Beurre">Beurre</option>
          </select>
        </div>

        <div
          class="flex w-40 h-12 justify-evenly content-center py-2 rounded-lg bg-white border border-gray-300 text-left"
          aria-label="Rechercher un appareil"
        >
          <h3 class="text-base font-light">Appareil</h3>
          <img
            src="/images/Arrow-down.png"
            alt="Déplier le filre d'appareils"
            class="size-3 ml-2 justify-center content-center"
          />
        </div>
        <div
          class="flex w-40 h-12 justify-evenly content-center py-2 rounded-lg bg-white border border-gray-300 text-left"
          aria-label="Rechercher un ustensile"
        >
          <h3 class="text-base font-light">Ustensile</h3>
          <img
            src="/images/Arrow-down.png"
            alt="Déplier le filre d'ustensiles"
            class="size-3 ml-2 justify-center content-center"
          />
        </div>
      </div>
      <div class="flex mt-8 mb-8 w-100" aria-label="1500 recettes">
        <h2 id="recipe-counter" class="recipe-counter flex justify-end text-2xl w-3xs">1500 recettes</h2>
      </div>
    </div>
  </section>

  <section class="recipes" aria-label="Liste des recettes">
    <div class="flex flex-wrap justify-evenly gap-10 px-10 py-4">
      <div class="flex w-3xs h-3xs rounded-lg bg-white shadow-md">
        <div class="flex object-contain overflow-hidden w-full h-full">
          <div class="flex absolute py-1 pr-1 justify-start"></div>
          <div class="flex font-bold text-lg justify-start items-center px-2">
            <h4 class="text-base">Recette</h4>
            <h4 class="text-base">Ingrédients</h4>
          </div>
          <div class="flex flex-col justify-start items-start px-2"></div>
        </div>
      </div>
      </div>
    </div>
  </section>
  </body>
</html>
